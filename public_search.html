<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVSV Public General Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" />
    <style>
        * { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { font-family: 'Lato', Arial, sans-serif; background-color: #f4f1ea; color: #333; padding: 20px; }
        #app { max-width: 800px; margin: 0 auto; }
        input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 1.2em; margin-bottom: 8px; }
        .subnote { font-size: 0.9em; color: #666; margin: 0 0 20px 0; }
        .result { border-bottom: 1px solid #ddd; padding: 10px; overflow-wrap: break-word; }
        .result h3 { margin: 0; overflow-wrap: break-word; word-break: break-word; }
        .result p { margin: 5px 0; overflow-wrap: break-word; word-break: break-word; }
        .source-tag { display: inline-block; font-size: 0.75em; font-weight: 700; text-transform: uppercase;
            background: #2c5f2d; color: #fff; padding: 2px 8px; border-radius: 3px; margin-bottom: 4px; }
        .source-link { font-size: 0.85em; }
        .status { color: #666; font-style: italic; }
        .error { color: #a33; }
    </style>
</head>
<body>
    <div id="app">
        <h1>KVSV Public General Search</h1>
        <p class="subnote">Searches public genealogy records from external public sources (WikiTree and the U.S. National Archives, including Dawes Rolls / Five Civilized Tribes enrollment records). This does not search KVSV's private research database — that is a separate, non-public project.</p>
        <input type="text" id="searchInput" placeholder="Enter a last name (e.g., Rogers, Bradford, Glass)" autocomplete="off" />
        <div id="resultsList"></div>
    </div>

    <script>
        // Public records proxy -- calls external public search APIs server-side
        // (browsers can't call api.wikitree.com or catalog.archives.gov directly
        // due to CORS / secret-key requirements). This proxy also applies the
        // WikiTree region filter: Americas, Europe, and Africa only -- no
        // Australia/Asia/Middle East. Never reads KVSV's private database.
        const PROXY_BASE = 'https://web-production-1d0fb.up.railway.app';

        const searchInput = document.getElementById('searchInput');
        const resultsList = document.getElementById('resultsList');
        let debounceTimer = null;

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str == null ? '' : String(str);
            return div.innerHTML;
        }

        async function searchPublicRecords() {
            const query = searchInput.value.trim();
            if (!query) {
                resultsList.innerHTML = '';
                return;
            }
            resultsList.innerHTML = '<p class="status">Searching public records...</p>';

            const wikitreeUrl = `${PROXY_BASE}/api/wikitree-search?lastName=${encodeURIComponent(query)}`;
            const naraUrl = `${PROXY_BASE}/api/nara-search?q=${encodeURIComponent(query)}`;

            const [wikitreeOutcome, naraOutcome] = await Promise.allSettled([
                fetch(wikitreeUrl).then(r => { if (!r.ok) throw new Error('WikiTree service returned ' + r.status); return r.json(); }),
                fetch(naraUrl).then(r => { if (!r.ok) throw new Error('National Archives service returned ' + r.status); return r.json(); }),
            ]);

            let combined = [];
            const errors = [];
            if (wikitreeOutcome.status === 'fulfilled') {
                combined = combined.concat(wikitreeOutcome.value.results || []);
            } else {
                errors.push('WikiTree: ' + wikitreeOutcome.reason.message);
            }
            if (naraOutcome.status === 'fulfilled') {
                combined = combined.concat(naraOutcome.value.results || []);
            } else {
                errors.push('National Archives: ' + naraOutcome.reason.message);
            }

            renderResults(combined, errors);
        }

        function renderResults(results, errors) {
            const errorBanner = (errors && errors.length)
                ? `<p class="error">Some sources didn't respond: ${escapeHtml(errors.join('; '))}</p>`
                : '';
            if (!results.length) {
                resultsList.innerHTML = errorBanner + '<p>No public records found for that name.</p>';
                return;
            }
            resultsList.innerHTML = errorBanner + results.map(r => {
                const name = escapeHtml(r.name || 'Unknown');
                const birth = r.birthDate ? escapeHtml(r.birthDate) : '';
                const birthPlace = r.birthLocation ? escapeHtml(r.birthLocation) : '';
                const death = r.deathDate ? escapeHtml(r.deathDate) : '';
                const deathPlace = r.deathLocation ? escapeHtml(r.deathLocation) : '';
                const note = r.note ? escapeHtml(r.note) : '';
                const source = escapeHtml(r.source || 'Public record');
                const sourceUrl = r.sourceUrl || '#';
                const bornLine = birth ? `<p><strong>Born:</strong> ${birth}${birthPlace ? ' (' + birthPlace + ')' : ''}</p>` : '';
                const diedLine = death ? `<p><strong>Died:</strong> ${death}${deathPlace ? ' (' + deathPlace + ')' : ''}</p>` : '';
                const noteLine = note ? `<p>${note}</p>` : '';
                return `<div class="result">
                    <span class="source-tag">${source}</span>
                    <h3>${name}</h3>
                    ${bornLine}
                    ${diedLine}
                    ${noteLine}
                    <p class="source-link"><a href="${sourceUrl}" target="_blank" rel="noopener">View full record on ${source}</a></p>
                </div>`;
            }).join('');
        }

        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(searchPublicRecords, 400);
        });
    </script>
</body>
</html>
