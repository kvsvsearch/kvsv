<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVSV Public General Search</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
    <style>
        body { font-family: Georgia, serif; background-color: #f4f1ea; color: #333; padding: 20px; }
        #app { max-width: 800px; margin: 0 auto; }
        input { width: 100%; padding: 10px; font-size: 1.2em; margin-bottom: 20px; }
        .result { border-bottom: 1px solid #ddd; padding: 10px; }
        .result h3 { margin: 0; }
        .result p { margin: 5px 0; }
    </style>
</head>
<body>
    <div id="app">
        <h1>KVSV Public General Search</h1>
        <p>Searching WikiTree for any name.</p>
        <input type="text" id="searchInput" placeholder="Enter a name (e.g., George Washington)" />
        <div style="display: flex; gap: 10px;">
            <input type="text" id="countyInput" placeholder="County (optional)" />
            <input type="text" id="stateInput" placeholder="State (optional)" />
        </div>
        <div id="resultsList"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbx2ECj68qvZyCmhpyLzDFpqkV5ZxNDuoZw9jdwnShHkohBztNxy0j_nKkr6wut_vh69Lg/exec";
        const searchInput = document.getElementById('searchInput');
        const countyInput = document.getElementById('countyInput');
        const stateInput = document.getElementById('stateInput');
        const resultsList = document.getElementById('resultsList');

        async function searchPerson() {
            const query = searchInput.value.trim();
            if (!query) return;
            const [first, ...rest] = query.split(' ');
            const last = rest.join(' ') || '';
            const county = countyInput.value.trim();
            const state = stateInput.value.trim();
            resultsList.innerHTML = "Searching...";
            try {
                const params = new URLSearchParams({ action: 'search', first: first, last: last });
                if (county) params.append('county', county);
                if (state) params.append('state', state);
                const response = await fetch(`${API_URL}?${params.toString()}`);
                const data = await response.json();
                if (data.status === "success") {
                    if (data.results.length === 0 && (county || state)) {
                        resultsList.innerHTML = "<p>No matches with that name AND location - try leaving County/State blank to see all name matches.</p>";
                    } else {
                        renderResults(data.results);
                    }
                } else {
                    resultsList.innerHTML = `<p>Error: ${data.message}</p>`;
                }
            } catch (error) {
                resultsList.innerHTML = `<p>Error fetching data: ${error.message}</p>`;
            }
        }

        function renderResults(results) {
            if (!results.length) {
                resultsList.innerHTML = "<p>No results found.</p>";
                return;
            }
            resultsList.innerHTML = results.map(r => `
                <div class="result">
                    <h3><a href="${r.profileUrl}" target="_blank">${r.firstName} ${r.lastName}</a></h3>
                    <p><strong>Birth:</strong> ${r.birthDate || 'Unknown'} (${r.birthLocation || 'Unknown'})</p>
                    <p><strong>Death:</strong> ${r.deathDate || 'Unknown'} (${r.deathLocation || 'Unknown'})</p>
                </div>
            `).join('');
        }

        let debounceTimer;
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(searchPerson, 500);
        });
    </script>
</body>
</html>
