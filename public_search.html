<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KVSV Public General Search</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" />
    <style>
        body { font-family: 'Lato', Arial, sans-serif; background-color: #f4f1ea; color: #333; padding: 20px; }
        #app { max-width: 800px; margin: 0 auto; }
        input, select { width: 100%; padding: 10px; font-size: 1.2em; margin-bottom: 20px; }
        .result { border-bottom: 1px solid #ddd; padding: 10px; }
        .result h3 { margin: 0; }
        .result p { margin: 5px 0; }
    </style>
</head>
<body>
    <div id="app">
        <h1>KVSV Public General Search</h1>
        <p>Searching the KVSV family database.</p>
        <input type="text" id="searchInput" placeholder="Enter a name (e.g., Bradford, Glass, Kates)" />
        <select id="tierSelect">
            <option value="">All Tiers</option>
            <option value="1">Tier 1</option>
            <option value="2">Tier 2</option>
            <option value="2-3">Tier 2-3</option>
            <option value="3">Tier 3</option>
            <option value="4">Tier 4</option>
        </select>
        <div id="resultsList"></div>
    </div>

    <script>
        const API_URL = 'snapshot.json';
        const searchInput = document.getElementById('searchInput');
        const tierSelect = document.getElementById('tierSelect');
        const resultsList = document.getElementById('resultsList');
        let masterDatabase = [];
        let fuse = null;

        async function loadData() {
            try {
                const response = await fetch(API_URL);
                masterDatabase = await response.json();
                fuse = new Fuse(masterDatabase, {
                    keys: ['full_name', 'entity_id'],
                    threshold: 0.3,
                    ignoreLocation: true
                });
                renderResults(masterDatabase);
            } catch (error) {
                resultsList.innerHTML = '<p>Error loading data: ' + error.message + '</p>';
            }
        }

        function searchPerson() {
            const query = searchInput.value.trim();
            const tier = tierSelect.value;
            let results = masterDatabase;

            if (query) {
                results = fuse.search(query).map(r => r.item);
            }

            if (tier) {
                results = results.filter(r => {
                    let level = r.tier;
                    if (level && typeof level === 'object') level = level.level;
                    return String(level).toLowerCase().replace('tier ', '') === tier;
                });
            }

            renderResults(results);
        }

        function renderResults(results) {
            if (!results.length) {
                resultsList.innerHTML = '<p>No results found.</p>';
                return;
            }
            resultsList.innerHTML = results.map(r => {
                const vitals = r.vitals || {};
                const tier = r.tier || {};
                const name = r.full_name || 'Unknown';
                const dob = vitals.dob || 'Unknown';
                const place = vitals.place || 'Unknown';
                const level = tier.level || 'Unknown';
                const narrative = r.narrative || '';
                return `<div class="result">
                    <h3>${name}</h3>
                    <p><strong>Tier:</strong> ${level}</p>
                    <p><strong>Born:</strong> ${dob} (${place})</p>
                    <p>${narrative}</p>
                </div>`;
            }).join('');
        }

        searchInput.addEventListener('input', searchPerson);
        tierSelect.addEventListener('change', searchPerson);
        loadData();
    </script>
</body>
</html>
