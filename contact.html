<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KVSV Family Records — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111013; --surface:#1a191d; --surface2:#211f24; --border:#34323a;
  --border-soft:#2a2830;
  --text:#f5f2ec; --muted:#a7a3ab; --faint:#77737c;
  --accent:#c1453d; --accent2:#8f322b; --accent-soft:#2c1917;
  --blue:#5b9bc0; --blue2:#3f7593; --blue-soft:#182228;
  --panel-bg:#241b17; --panel-border:#4a352a; --panel-text:#e7d9cf;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.55);
  --shadow-pop:0 4px 10px -4px rgba(0,0,0,0.5), 0 16px 40px -18px rgba(0,0,0,0.6);
  --ease:cubic-bezier(.2,.7,.3,1);
  --font-display:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-body:Georgia, 'Times New Roman', serif;
  --font-ui:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{
  margin:0;color:var(--text);font-family:var(--font-body);
  background:
    radial-gradient(1100px 520px at 12% -8%, rgba(91,155,192,0.07), transparent 60%),
    radial-gradient(900px 480px at 88% 0%, rgba(193,69,61,0.06), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  padding:40px 40px 64px;
}
a{color:var(--blue);text-decoration:none;transition:color 0.15s var(--ease);}
a:hover{color:#8ec2e2;text-decoration:underline;}
.wrap{max-width:640px;margin:0 auto;}
h1.page-title{font-family:var(--font-display);font-size:46px;font-weight:700;color:var(--blue);margin:0 0 20px;letter-spacing:-0.015em;line-height:1.15;}
.intro{font-size:14.5px;color:var(--muted);max-width:640px;margin:0 0 26px;}
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:28px 30px;margin-bottom:22px;box-shadow:var(--shadow-card);}
.form-section h3{font-family:var(--font-ui);font-size:15px;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;color:var(--blue);margin:0 0 20px;border-bottom:1px solid var(--border);padding-bottom:12px;}
.field{margin-bottom:19px;}
.field label{display:block;font-family:var(--font-ui);font-size:14px;letter-spacing:0.03em;text-transform:uppercase;font-weight:700;color:var(--text);margin-bottom:8px;}
.field input, .field select, .field textarea{width:100%;padding:13px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-ui);font-size:15.5px;transition:border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
.field textarea{min-height:90px;resize:vertical;}
.submit-btn{background:var(--blue);color:#fff;border:none;padding:14px 32px;border-radius:var(--radius-sm);font-family:var(--font-ui);font-size:15px;font-weight:700;cursor:pointer;margin-top:18px;box-shadow:var(--shadow-card);transition:background 0.15s var(--ease), transform 0.15s var(--ease);}
.submit-btn:hover{background:var(--blue2);transform:translateY(-1px);}
.page-footer-note{text-align:center;font-size:13px;color:var(--faint);margin-top:30px;padding-top:22px;border-top:1px solid var(--border);}
.form-status{font-family:var(--font-ui);font-size:14px;border-radius:var(--radius-sm);padding:12px 16px;margin-top:16px;display:none;}
.form-status.show{display:block;}
.form-status.ok{background:#16241b;border:1px solid #2f5a3d;color:#6fae7f;}
.form-status.err{background:var(--accent-soft);border:1px solid #5a2320;color:#e9d6d2;}
.submit-btn:disabled{opacity:0.55;cursor:not-allowed;transform:none;}
</style>
</head>
<body>
<div class="wrap">

<h1 class="page-title">Contact KVSV</h1>
<p class="intro">Questions, corrections, deletion requests, or anything else &mdash; send it here.</p>

<form id="contact-form" class="form-section" novalidate>
  <h3>Send a message</h3>
  <div class="field"><label for="c-name">Full Name *</label><input type="text" id="c-name" required></div>
  <div class="field"><label for="c-email">Email Address *</label><input type="email" id="c-email" required></div>
  <div class="field"><label for="c-subject">Subject</label><select id="c-subject"><option>General question</option><option>Correction request</option><option>Deletion request</option><option>Something else</option></select></div>
  <div class="field"><label for="c-message">Message *</label><textarea id="c-message" required></textarea></div>
  <input type="text" id="c-website" name="website" autocomplete="off" tabindex="-1" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0;" aria-hidden="true">
  <div><button class="submit-btn" type="submit" id="c-submit">Send Message</button></div>
  <div class="form-status" id="c-status"></div>
</form>

<div class="page-footer-note">KVSV &mdash; messages sent here are reviewed by KVSV.</div>

</div>
<script>
const CONTACT_ENDPOINT = 'https://web-production-1d0fb.up.railway.app/api/contact';
const form = document.getElementById('contact-form');
const statusEl = document.getElementById('c-status');
const submitBtn = document.getElementById('c-submit');

function showStatus(kind, text) {
  statusEl.className = 'form-status show ' + kind;
  statusEl.textContent = text;
}

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  const name = document.getElementById('c-name').value.trim();
  const email = document.getElementById('c-email').value.trim();
  const subject = document.getElementById('c-subject').value;
  const message = document.getElementById('c-message').value.trim();
  const website = document.getElementById('c-website').value;

  if (!name || !email || !message) {
    showStatus('err', 'Please fill in your name, email, and message.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Sending…';
  statusEl.className = 'form-status';

  try {
    const resp = await fetch(CONTACT_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, subject, message, website }),
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      throw new Error(data.error || ('Server returned ' + resp.status));
    }
    showStatus('ok', 'Message sent — thank you. KVSV will review and respond if needed.');
    form.reset();
  } catch (err) {
    showStatus('err', 'Could not send your message: ' + err.message + '. Please try again in a moment.');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Send Message';
  }
});
</script>
</body>
</html>
