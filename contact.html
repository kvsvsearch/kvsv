<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KVSV Family Records — Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111013; --surface:#1a191d; --surface2:#211f24; --border:#34323a;
  --border-soft:#2a2830;
  --text:#f5f2ec; --muted:#a7a3ab; --faint:#77737c;
  --accent:#c1453d; --accent2:#8f322b; --accent-soft:#2c1917;
  --blue:#5b9bc0; --blue2:#3f7593; --blue-soft:#182228;
  --panel-bg:#241b17; --panel-border:#4a352a; --panel-text:#e7d9cf;
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px;
  --shadow-card:0 1px 2px rgba(0,0,0,0.4), 0 8px 24px -12px rgba(0,0,0,0.55);
  --shadow-pop:0 4px 10px -4px rgba(0,0,0,0.5), 0 16px 40px -18px rgba(0,0,0,0.6);
  --ease:cubic-bezier(.2,.7,.3,1);
  --font-display:'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-body:Georgia, 'Times New Roman', serif;
  --font-ui:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{
  margin:0;color:var(--text);font-family:var(--font-body);
  background:
    radial-gradient(1100px 520px at 12% -8%, rgba(91,155,192,0.07), transparent 60%),
    radial-gradient(900px 480px at 88% 0%, rgba(193,69,61,0.06), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  padding:40px 40px 64px;
}
a{color:var(--blue);text-decoration:none;transition:color 0.15s var(--ease);}
a:hover{color:#8ec2e2;text-decoration:underline;}
.wrap{max-width:640px;margin:0 auto;}
h1.page-title{font-family:var(--font-display);font-size:46px;font-weight:700;color:var(--blue);margin:0 0 20px;letter-spacing:-0.015em;line-height:1.15;}
.intro{font-size:14.5px;color:var(--muted);max-width:640px;margin:0 0 26px;}
.form-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:28px 30px;margin-bottom:22px;box-shadow:var(--shadow-card);}
.form-section h3{font-family:var(--font-ui);font-size:15px;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;color:var(--blue);margin:0 0 20px;border-bottom:1px solid var(--border);padding-bottom:12px;}
.field{margin-bottom:19px;}
.field label{display:block;font-family:var(--font-ui);font-size:14px;letter-spacing:0.03em;text-transform:uppercase;font-weight:700;color:var(--text);margin-bottom:8px;}
.field input, .field select, .field textarea{width:100%;padding:13px 15px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font-ui);font-size:15.5px;transition:border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);}
.field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft);}
.field textarea{min-height:90px;resize:vertical;}
.submit-btn{background:var(--blue);color:#fff;border:none;padding:14px 32px;border-radius:var(--radius-sm);font-family:var(--font-ui);font-size:15px;font-weight:700;cursor:pointer;margin-top:18px;box-shadow:var(--shadow-card);transition:background 0.15s var(--ease), transform 0.15s var(--ease);}
.submit-btn:hover{background:var(--blue2);transform:translateY(-1px);}
.page-footer-note{text-align:center;font-size:13px;color:var(--faint);margin-top:30px;padding-top:22px;border-top:1px solid var(--border);}
</style>
</head>
<body>
<div class="wrap">

<h1 class="page-title">Contact KVSV</h1>
<p class="intro">Questions, corrections, deletion requests, or anything else &mdash; send it here.</p>

<div class="form-section">
  <h3>Send a message</h3>
  <div class="field"><label>Full Name *</label><input type="text"></div>
  <div class="field"><label>Email Address *</label><input type="text"></div>
  <div class="field"><label>Subject</label><select><option>-- Select --</option><option>General question</option><option>Correction request</option><option>Deletion request</option><option>Something else</option></select></div>
  <div class="field"><label>Message *</label><textarea></textarea></div>
  <div><button class="submit-btn" type="button">Send Message</button></div>
</div>

<div class="page-footer-note">KVSV &mdash; messages sent here are reviewed by KVSV. This is a demo form; nothing is transmitted yet.</div>

</div>
</body>
</html>
